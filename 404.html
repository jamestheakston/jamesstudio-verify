<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Couldn't Be Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #FAF9F6;
            color: #1A1A1A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1, h2 {
            font-family: 'Syne', sans-serif;
            letter-spacing: -0.02em;
        }

        .screen {
            background: white;
            width: 100%;
            max-width: 360px;
            padding: 32px 24px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .screen { animation: none; }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 40px;
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: #1A1A1A;
            text-decoration: none;
        }

        .logo-pill {
            background: #1A1A1A;
            color: #FAF9F6;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 3px 8px;
            border-radius: 9999px;
        }

        .code {
            font-family: 'Syne', sans-serif;
            font-size: 72px;
            font-weight: 800;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn {
            display: block;
            padding: 14px 16px;
            border-radius: 12px;
            background: #1A1A1A;
            color: white;
            border: 1px solid #1A1A1A;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: #333;
        }

        .links {
            margin-top: 24px;
            font-size: 12px;
        }

        .links a {
            color: #666;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="screen">
        <a class="logo" href="/" aria-label="James Studio">
            JAMES<span class="logo-pill">Studio</span>
        </a>

        <div class="code">404</div>
        <h1>This page couldn't be found</h1>
        <p>If you followed a verification link, the verification ID may be invalid or expired.</p>

        <a class="btn" href="/">Back to verification</a>

        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
        </div>
    </div>
</body>
</html>
